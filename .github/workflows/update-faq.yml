# 매주 국립국어원 '자주 묻는 질문'을 확인하여, 바뀐 내용이 있으면 앱에 반영합니다.
name: FAQ 자동 업데이트

on:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 오전 3시(한국 시간)
  workflow_dispatch: {} # Actions 화면에서 직접 실행할 수도 있음

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FAQ 읽어 오기
        run: python scripts/update_faq.py
      - name: 바뀐 내용이 있으면 반영 (main, gh-pages)
        run: |
          if git diff --quiet -- js/data/faq.js; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "faq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data/faq.js
          git commit -m "FAQ 자동 업데이트 (국립국어원 자주 묻는 질문)"
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
